name: Build package

on:
  workflow_dispatch:
  push:
    branches:
      - packager_migration
      - master

jobs:
  package:
    if: github.ref_name == 'packager_migration' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - ubuntu/22.04
          - ubuntu/24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        run: |
          VERSION=$(ruby -e "content = File.read('config/initializers/version.rb'); puts content[/VERSION\s*=\s*['\"]([^'\"]+)['\"]/, 1]")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - uses: pkgr/action/package@v1
        id: package
        with:
          target: ${{ matrix.target }}
          version: ${{ env.APP_VERSION }}

      - uses: pkgr/action/publish@v1
        with:
          file: ${{ steps.package.outputs.package_path }}
          target: ${{ matrix.target }}
          repository: projectcypress/cypress
          channel: ${{ github.ref_name }}
          token: ${{ secrets.PACKAGER_PUBLISH_TOKEN }}
